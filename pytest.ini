[pytest]
# Plain `pytest` runs only the offline self-tests. Live runs are explicit:
#   pytest test_sources.py   (read each source, save snapshots)
#   pytest test_main.py      (send the prompts to NCP and grade them)
testpaths = selftest
# The HTML report name is set per run in ncp_suite/pytest_plugin.py:
#   reports/NCP_MCP_Prompt_Results_<time>.html · reports/Source_Probe_<time>.html · reports/selftest.html
# -n 8 --dist loadgroup: 8 worker processes, one per connector (4 network + Prometheus + DCGM + BCM + Dynamo); each connector's tests stay on one
# worker, one prompt at a time (tests carry xdist_group(<connector>)). `-n 0` = one test at a time with live logs.
addopts = -p no:randomly -ra --tb=short --self-contained-html -n 8 --dist loadgroup
# all sources and NCP use self-signed certificates in the lab (CLAUDE.md §3.6): expected, not news
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
markers =
    probe: reads each ground-truth source and saves a snapshot (no NCP chat)
    offline: self-tests with fake data, no network
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
# rewrite the HTML after every test: a long run can be watched, and a stopped run keeps its results
generate_report_on_test = true
